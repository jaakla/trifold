[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "settlementcheck"
version = "0.1.0"
description = "Offline GHS-WUP Degree of Urbanisation lookup on the Trifold T3 grid"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = ["degurba", "settlement", "urban", "rural", "geospatial", "offline", "dggs"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
batch = ["numpy", "t3grid"]

[project.scripts]
settlementcheck = "settlementcheck:_main"

[project.urls]
Homepage = "https://jaakla.github.io/trifold/settlementcheck.html"
Repository = "https://github.com/jaakla/trifold"

[tool.hatch.build.targets.wheel.force-include]
"python/settlementcheck.py" = "settlementcheck/__init__.py"
"python/_fastloc.py" = "settlementcheck/_fastloc.py"
"data/degurba_R2025A_E2025_L12.tfdg" = "settlementcheck/data/degurba_R2025A_E2025_L12.tfdg"
"data/manifest.json" = "settlementcheck/data/manifest.json"
"data/NOTICE.md" = "settlementcheck/data/NOTICE.md"

[tool.hatch.build.targets.sdist]
include = ["python/*.py", "data/*", "README.md", "build.py"]

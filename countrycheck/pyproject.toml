[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "countrycheck"
version = "0.1.0"
description = "Offline country point lookup: 323 KB global dataset, microsecond answers with confidence, built on the Trifold T3 triangular DGGS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = ["country", "reverse-geocoding", "iso-3166", "point-in-polygon", "geospatial", "offline", "dggs", "borders"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
batch = ["numpy", "t3grid"]

[project.scripts]
countrycheck = "countrycheck:_main"

[project.urls]
Homepage = "https://jaakla.github.io/trifold/countrycheck.html"
Repository = "https://github.com/jaakla/trifold"

# Repo layout is python/ + data/; assemble the installable package here.
[tool.hatch.build.targets.wheel.force-include]
"python/countrycheck.py" = "countrycheck/__init__.py"
"python/_fastloc.py" = "countrycheck/_fastloc.py"
"data/countries_L10.tfcs" = "countrycheck/data/countries_L10.tfcs"

[tool.hatch.build.targets.sdist]
include = ["python/countrycheck.py", "python/_fastloc.py", "data/countries_L10.tfcs", "README.md"]

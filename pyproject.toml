[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "t3grid"
version = "0.1.0"
description = "Trifold T3: hierarchical triangular DGGS on the icosahedron with exact aperture-4 nesting and compact base32 addressing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy"]
keywords = ["dggs", "geospatial", "triangular-grid", "global-grid", "icosahedron", "h3-alternative", "spatial-index"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://jaakla.github.io/trifold/"
Repository = "https://github.com/jaakla/trifold"
Documentation = "https://github.com/jaakla/trifold/blob/main/docs/t3-technical-reference.md"

[project.optional-dependencies]
land = ["shapely>=2.0", "pyproj"]
build = ["shapely>=2.0", "pyproj", "geopandas", "topojson", "h3>=4", "pya5", "s2sphere", "rhealpixdggs", "matplotlib"]
dev = ["pytest"]

[project.scripts]
trifold = "trifold.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
